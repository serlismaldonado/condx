name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Compila, clippy sin advertencias y los tests (macOS: launchd, Llavero, Touch ID).
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: The installer served by the site is the repo's
        run: cmp install.sh site/install.sh && bash -n install.sh

  # La demo de la web: la app compila a WebAssembly.
  wasm:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and wasm target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: Check the web demo
        # gpui-web usa wasm_thread, que pide una característica de nightly.
        run: RUSTC_BOOTSTRAP=1 cargo check -p devtool-app --lib --target wasm32-unknown-unknown

  # El host de agentes (Node, pi durable): tipos y pruebas con el modelo guionado.
  agent-host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-host/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev

  # Vulnerabilidades conocidas en las dependencias (RustSec).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        run: cargo audit
