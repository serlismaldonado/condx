name: Release

# El release en la nube, de respaldo: lo normal es publicarlo desde la Mac con scripts/release.sh
# (local primero, minutos en vez de 15+). Corre a mano, o lo lanza el daemon cuando no hay una Mac
# disponible (la receta `release-condx`), para un tag que ya existe.
# Sin firma de Developer ID: install.sh quita la cuarentena al instalar.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (it must exist). Empty: a new version is made here (below)"
        required: false
        default: ""
      version:
        description: "Without a tag: the new version (X.Y.Z); empty for the next patch"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      # Sin tag (lo pide un daemon sin Mac, p. ej. el sitio en la nube): la versión nueva se hace aquí,
      # como scripts/release-cloud.sh: Cargo.toml, Cargo.lock, commit, tag y push.
      - name: New version
        if: ${{ inputs.tag == '' }}
        run: |
          CURRENT="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          VERSION="${{ inputs.version }}"; VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then IFS=. read -r MA MI PA <<<"$CURRENT"; VERSION="$MA.$MI.$((PA + 1))"; fi
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then echo "::error::tag $TAG already exists"; exit 1; fi
          sed -i '' "s/^version = \"$CURRENT\"/version = \"$VERSION\"/" Cargo.toml
          cargo update -w -q
          git config user.name "Condx release"
          git config user.email "release@condx.local"
          git add Cargo.toml Cargo.lock
          git commit -q -m "release: $TAG"
          git tag -a "$TAG" -m "Condx $TAG"
          git push -q origin HEAD "$TAG"
          echo "NEW_TAG=$TAG" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Tests
        run: cargo test --workspace
      - name: Build
        run: cargo build --release -p devtool-app -p devtool-daemon
      - name: Package
        run: |
          TAG="${{ inputs.tag }}"; TAG="${TAG:-${NEW_TAG:-${{ github.ref_name }}}}"
          NAME="condx-${TAG}-macos-arm64"
          mkdir -p dist
          APP_DIR="$PWD/dist" SKIP_BUILD=1 scripts/bundle-app.sh release
          cp target/release/condxd dist/condxd
          codesign --force --sign - dist/condxd
          # El host de agentes (el daemon instala sus dependencias con npm ci).
          mkdir -p dist/agent-host && cp -R agent-host/src agent-host/package.json agent-host/package-lock.json dist/agent-host/
          tar -czf "$NAME.tar.gz" -C dist Condx.app condxd agent-host
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      # El manifiesto firmado que el daemon verifica antes de actualizarse (update.rs): versión,
      # archivo y SHA-256, firmados con la llave de actualización (Ed25519).
      - name: Signed manifest
        env:
          CONDX_UPDATE_KEY: ${{ secrets.CONDX_UPDATE_KEY }}
        run: |
          if [ -z "$CONDX_UPDATE_KEY" ]; then echo "::warning::CONDX_UPDATE_KEY isn't set: no manifest, daemons won't offer this release"; exit 0; fi
          SUM=$(cut -d' ' -f1 "$NAME.tar.gz.sha256")
          printf '{"version":"%s","tag":"%s","asset":"%s","url":"https://github.com/%s/releases/download/%s/%s","sha256":"%s","published":"%s"}' \
            "${TAG#v}" "$TAG" "$NAME.tar.gz" "${{ github.repository }}" "$TAG" "$NAME.tar.gz" "$SUM" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > manifest.json
          umask 077 && printf '%s\n' "$CONDX_UPDATE_KEY" > update-key.pem
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          "$OPENSSL" pkeyutl -sign -inkey update-key.pem -rawin -in manifest.json -out manifest.json.sig
          rm -f update-key.pem
          echo "MANIFEST=manifest.json manifest.json.sig" >> "$GITHUB_ENV"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$NAME.tar.gz" "$NAME.tar.gz.sha256" install.sh $MANIFEST --clobber
          else
            gh release create "$TAG" "$NAME.tar.gz" "$NAME.tar.gz.sha256" install.sh $MANIFEST --generate-notes --title "Condx $TAG"
          fi
