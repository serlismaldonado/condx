[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

# La app GPUI en desarrollo: optimizar las dependencias pesadas (render y
# layout) hace usable el modo debug; el primer build tarda más.
[profile.dev.package."*"]
opt-level = 2

# La demo de la web (scripts/build-web-demo.sh): lo más chica posible para descargarla.
[profile.web]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
