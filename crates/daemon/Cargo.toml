[package]
name = "devtool-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "condxd"
path = "src/main.rs"

[dependencies]
devtool-core = { path = "../core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
# Condx Cloud: el motor local-first (SQLite + transporte HTTP de Convex).
localfirst-core = { git = "https://github.com/serlismaldonado/localfirst", rev = "6c3fa6a9f59f76521b76dba1f6a1edeb857eb31a" }
indexmap = "2"
# Verificar las decisiones firmadas por los teléfonos vinculados (Condx Cloud).
ed25519-dalek = "2"
ureq = "2"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
libc = "0.2"
keyring = { version = "3", features = ["apple-native"] }
age = { version = "0.12", features = ["armor"] }

[dev-dependencies]
tempfile = "3"
# Pruebas de seguridad del router HTTP (security_tests.rs): peticiones sin abrir puertos.
tower = { version = "0.5", features = ["util"] }
