name = "workflow-approval-strict"
title = "Reinforced workflow approval"
description = "A deploy workflow step that only waits for the user's approval in the app. It does nothing else."
kinds = ["devbox", "throwaway", "cloud-dev", "cloud-prod"]
projects = true
writes = false

[approval]
devbox = "typed"
throwaway = "typed"
cloud-dev = "typed"
cloud-prod = "reinforced"

[[args]]
name = "message"
type = "string"
default = "Aprobar"
description = "What is being approved"

[[step]]
name = "Approved"
builtin = "workflow-gate"
timeout_secs = 10
